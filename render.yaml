services:
  - type: web
    name: psytech-agora
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
      - key: EMAIL_SENHA
        sync: false
